<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In - Prime Wallet Bank</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="pw-body">
  <div class="pw-container">
    <header class="pw-header">
      <div class="pw-logo">🏦 Prime Wallet<br>Bank - USA 🇺🇸</div>
    </header>

    <main class="pw-main">
      <h1>Sign In</h1>
      <p>Access your Prime Wallet Bank account</p>

      <form class="pw-form">
        <label>Email Address</label>
        <input type="email" placeholder="yourname@email.com" required />

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required />

        <button class="pw-btn pw-btn-primary">Sign In</button>
      </form>

      <p class="pw-link">
        Don't have an account? <a href="register.html">Create one now</a>
      </p>
    </main>

    <footer class="pw-footer">
      <p>© 2026 Prime Wallet Bank - USA. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
