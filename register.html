<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account - Prime Wallet Bank</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="pw-body">
  <div class="pw-container">
    <header class="pw-header">
      <div class="pw-logo">🏦 Prime Wallet<br>Bank - USA 🇺🇸</div>
    </header>

    <main class="pw-main">
      <h1>Create Your Account</h1>
      <p>Secure Registration — All Fields Required</p>

      <form class="pw-form">
        <label>Email Address</label>
        <input type="email" placeholder="yourname@email.com" required />

        <label>Phone Number</label>
        <input type="tel" placeholder="+1 XXX XXX XXXX" required />

        <label>Date of Birth</label>
        <input type="date" required />

        <label>Create Password</label>
        <input type="password" placeholder="8+ characters" required />

        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter your password" required />

        <button class="pw-btn pw-btn-primary">Submit for Admin Approval</button>
      </form>

      <p class="pw-link">
        Already have an account? <a href="signin.html">Sign In</a>
      </p>
    </main>

    <footer class="pw-footer">
      <p>© 2026 Prime Wallet Bank - USA. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
